
name: Osmanlı Tarayıcı APK Derle

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: APK Derleme
    runs-on: ubuntu-latest

    steps:
      - name: GitHub deposunu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android lisanslarını kabul et
        run: yes | sdkmanager --licenses || true

      - name: APK derle
        run: gradle --no-daemon clean assembleDebug

      - name: APK dosyasını kontrol et
        run: |
          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "APK bulunamadı!"
            exit 1
          fi

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: Osmanli-Tarayici-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
